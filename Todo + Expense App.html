<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清单 · 记账</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent-hue: 70;
    --radius: 18px;
    --paper: oklch(0.978 0.008 85);        /* 暖白 */
    --paper-deep: oklch(0.955 0.012 85);
    --ink: oklch(0.28 0.015 60);
    --ink-soft: oklch(0.52 0.02 60);
    --ink-faint: oklch(0.68 0.015 60);
    --accent: oklch(0.72 0.13 var(--accent-hue));
    --accent-ink: oklch(0.45 0.11 var(--accent-hue));
    --accent-soft: oklch(0.93 0.045 var(--accent-hue));
    --card-shadow: 0 1px 2px oklch(0.4 0.02 60 / 0.05), 0 4px 14px oklch(0.4 0.02 60 / 0.05);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Outfit", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: var(--paper-deep);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ---- 外壳:手机宽度居中,小屏铺满 ---- */
  .app { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .phone {
    width: min(430px, 100vw);
    height: min(880px, 100vh);
    background: var(--paper);
    display: flex; flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  @media (min-width: 480px) and (min-height: 920px) {
    .phone { border-radius: 36px; box-shadow: 0 24px 80px oklch(0.3 0.02 60 / 0.16), 0 0 0 1px oklch(0.9 0.01 85); }
  }
  .screen { flex: 1; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }

  /* ---- 页面通用 ---- */
  .page { padding: 28px 22px 32px; display: flex; flex-direction: column; gap: 18px; }
  .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .page-head h1 { font-size: 26px; font-weight: 700; letter-spacing: 0.01em; }
  .page-sub { margin-top: 4px; font-size: 14px; color: var(--ink-soft); text-wrap: balance; word-break: keep-all; }
  .detail-head { align-items: flex-start; }
  .detail-left { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
  .back-btn {
    flex: none; width: 38px; height: 38px; margin-top: 2px;
    display: grid; place-items: center;
    border: none; border-radius: 12px; cursor: pointer;
    background: var(--paper-deep); color: var(--ink-soft);
    transition: background 0.15s;
  }
  .back-btn:hover { background: var(--accent-soft); color: var(--accent-ink); }

  /* ---- 右上角 + 号 ---- */
  .add-btn {
    flex: none; width: 44px; height: 44px; margin-top: 2px;
    display: grid; place-items: center;
    border: none; border-radius: 14px; cursor: pointer;
    background: var(--accent-soft); color: var(--accent-ink);
    box-shadow: 0 1px 2px oklch(0.4 0.02 60 / 0.06);
    transition: transform 0.15s, background 0.15s;
  }
  .add-btn:hover { transform: scale(1.06); }
  .add-btn:active { transform: scale(0.94); }

  /* ---- FLIP 重排包装 ---- */
  .task-flip { position: relative; }

  /* ---- 模态对话框 + 毛玻璃遮罩 ---- */
  .modal-backdrop {
    position: absolute; inset: 0; z-index: 60;
    display: grid; place-items: center;
    padding: 24px;
    background: oklch(0.96 0.01 85 / 0.42);
    -webkit-backdrop-filter: blur(14px) saturate(130%);
    backdrop-filter: blur(14px) saturate(130%);
    animation: backdrop-in 0.25s ease;
  }
  @keyframes backdrop-in { from { opacity: 0; } }
  .modal-card {
    width: 100%; max-width: 372px;
    background: oklch(0.99 0.004 85);
    border-radius: 24px;
    padding: 20px 20px 18px;
    box-shadow: 0 24px 70px oklch(0.3 0.02 60 / 0.22), 0 2px 8px oklch(0.3 0.02 60 / 0.08);
    animation: modal-pop 0.32s cubic-bezier(0.3, 1.35, 0.45, 1);
  }
  @keyframes modal-pop { from { opacity: 0; transform: scale(0.9) translateY(14px); } }
  .dialog-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .dialog-body { display: flex; gap: 16px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .btn-ghost, .btn-primary {
    border: none; cursor: pointer; font: inherit; font-size: 14px; font-weight: 600;
    height: 40px; padding: 0 18px; border-radius: 13px;
    transition: transform 0.12s, opacity 0.15s;
  }
  .btn-ghost { background: var(--paper-deep); color: var(--ink-soft); }
  .btn-ghost:hover { background: oklch(0.93 0.014 85); }
  .btn-primary { background: var(--accent); color: oklch(0.99 0.005 85); }
  .btn-primary:disabled { opacity: 0.35; cursor: default; }
  .btn-primary:not(:disabled):active { transform: scale(0.96); }

  /* ---- 圆形类型选择 ---- */
  .type-picker { flex: none; display: flex; flex-direction: column; align-items: center; gap: 12px; width: 96px; }
  .type-big {
    width: 92px; height: 92px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    transition: background 0.2s, color 0.2s;
  }
  .type-big-glyph { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .type-big-label { font-size: 12px; font-weight: 500; opacity: 0.85; }
  .type-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .type-dot {
    width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center;
    border: none; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 600;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .type-dot:hover { transform: scale(1.1); }
  .type-dot.is-active { box-shadow: 0 0 0 2.5px var(--paper), 0 0 0 5px var(--dot-ring); transform: scale(1.06); }

  /* ---- 对话框右侧字段 ---- */
  .dialog-fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > span { font-size: 12px; font-weight: 500; color: var(--ink-soft); }
  .field input {
    width: 100%; height: 40px;
    border: 1.5px solid oklch(0.9 0.012 85); border-radius: 12px;
    padding: 0 12px;
    font: inherit; font-size: 14px;
    background: var(--paper); color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--accent); }
  .field input::placeholder { color: var(--ink-faint); }
  .time-range { display: flex; align-items: center; gap: 6px; }
  .time-range input { flex: 1; min-width: 0; padding: 0 8px; }
  .time-range i { font-style: normal; color: var(--ink-faint); }

  /* ---- 图例 ---- */
  .legend { display: flex; gap: 14px; }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-soft); }
  .legend-item i { width: 10px; height: 10px; border-radius: 4px; display: inline-block; }

  /* ---- 任务卡片 ---- */
  .task-list { display: flex; flex-direction: column; gap: 12px; }
  .task-card {
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--card-shadow);
    transition: background 0.3s;
  }
  .task-bar-track { height: 6px; width: 100%; }
  .task-bar-fill { height: 100%; border-radius: 0 999px 999px 0; transition: width 0.6s ease; }
  .task-body { display: flex; align-items: center; gap: 14px; padding: 14px 16px 15px; }
  .density-compact .task-body { padding: 10px 14px 11px; gap: 11px; }
  .task-icon {
    flex: none; width: 42px; height: 42px;
    display: grid; place-items: center;
    border-radius: calc(var(--radius) * 0.72);
    font-size: 17px; font-weight: 600;
  }
  .density-compact .task-icon { width: 36px; height: 36px; font-size: 15px; }
  .task-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .task-title { font-size: 15.5px; font-weight: 500; line-height: 1.35; text-wrap: pretty; }
  .task-title.is-done { text-decoration: line-through; color: var(--ink-faint); }
  .task-note { font-size: 12.5px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .task-note span { white-space: nowrap; }
  .task-note-dot { opacity: 0.5; }
  .status-done .task-note { color: var(--ink-faint); }

  /* ---- 复选框:点击先缩小再放大 ---- */
  .task-check {
    position: relative;
    flex: none; width: 44px; height: 44px; margin: -8px;
    display: grid; place-items: center;
    border: none; background: transparent; cursor: pointer;
    color: transparent;
  }
  .task-check::before {
    content: ""; position: absolute;
    width: 26px; height: 26px; border-radius: 9px;
    border: 2px solid var(--check-ink, var(--ink-faint));
    opacity: 0.55;
    background: oklch(1 0 0 / 0.45);
    transition: background 0.2s, opacity 0.2s;
  }
  .task-check svg { position: relative; z-index: 1; transition: color 0.15s; }
  .task-check.is-checked { color: oklch(0.99 0.005 85); }
  .task-check.is-checked::before {
    background: var(--check-ink, var(--ink-soft));
    opacity: 1; border-color: transparent;
  }
  .task-check.is-pulsing { animation: check-pulse 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes check-pulse {
    0%   { transform: scale(1); }
    35%  { transform: scale(0.55); }
    70%  { transform: scale(1.22); }
    100% { transform: scale(1); }
  }

  /* ---- 饼图 ---- */
  .donut-wrap { position: relative; align-self: center; width: min(78%, 320px); transition: width 0.45s cubic-bezier(0.3, 0.9, 0.3, 1); }
  .donut-wrap.is-zoomed { width: min(100%, 400px); }
  .donut-svg { width: 100%; display: block; cursor: pointer; overflow: visible; }
  .donut-slice {
    transition: transform 0.22s cubic-bezier(0.3, 0.9, 0.4, 1.2), fill 0.2s;
    stroke: var(--paper); stroke-width: 0;
  }
  .donut-center-title { font-size: 13px; fill: var(--ink-soft); font-family: inherit; }
  .donut-center-value { font-size: 24px; font-weight: 700; fill: var(--ink); font-family: inherit; letter-spacing: 0.01em; }
  .donut-hint { text-align: center; margin-top: 6px; font-size: 12px; color: var(--ink-faint); }
  .donut-tip {
    position: absolute; z-index: 5;
    transform: translate(-50%, calc(-100% - 14px));
    pointer-events: none;
    background: oklch(0.99 0.005 85 / 0.92);
    backdrop-filter: blur(8px);
    border: 1px solid oklch(0.9 0.01 85);
    border-radius: 12px;
    padding: 9px 12px;
    box-shadow: 0 6px 24px oklch(0.3 0.02 60 / 0.14);
    display: flex; flex-direction: column; gap: 2px;
    min-width: 96px;
  }
  .donut-tip-tag { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--tip-ink); }
  .donut-tip-tag i { width: 9px; height: 9px; border-radius: 3px; background: var(--tip-chip); }
  .donut-tip-pct { font-size: 19px; font-weight: 700; }
  .donut-tip-amt { font-size: 12.5px; color: var(--ink-soft); }

  /* ---- 支出卡片 ---- */
  .expense-list { display: flex; flex-direction: column; gap: 12px; }
  .expense-card {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    border: none; border-radius: var(--radius);
    box-shadow: var(--card-shadow);
    font: inherit; color: inherit; text-align: left;
    width: 100%;
  }
  .density-compact .expense-card { padding: 10px 14px; gap: 11px; }
  .expense-card.is-clickable { cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
  .expense-card.is-clickable:hover { transform: translateY(-1px); box-shadow: 0 3px 6px oklch(0.4 0.02 60 / 0.07), 0 8px 22px oklch(0.4 0.02 60 / 0.08); }
  .expense-card.is-clickable:active { transform: translateY(0) scale(0.99); }
  .expense-chip {
    flex: none; width: 42px; height: 42px;
    display: grid; place-items: center;
    border-radius: calc(var(--radius) * 0.72);
    font-size: 17px; font-weight: 600;
  }
  .density-compact .expense-chip { width: 36px; height: 36px; font-size: 15px; }
  .expense-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .expense-title { font-size: 15.5px; font-weight: 500; }
  .expense-note { font-size: 12.5px; color: var(--ink-soft); }
  .expense-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .expense-amt { font-size: 15.5px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
  .expense-pct { font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .expense-arrow { flex: none; color: var(--ink-faint); margin-left: -4px; }

  /* ---- 健康页 ---- */
  .head-actions { display: flex; gap: 10px; align-items: flex-start; }
  .gear-btn {
    flex: none; width: 44px; height: 44px; margin-top: 2px;
    display: grid; place-items: center;
    border: none; border-radius: 14px; cursor: pointer;
    background: var(--paper-deep); color: var(--ink-faint);
    transition: background 0.15s, color 0.15s, transform 0.15s;
  }
  .gear-btn svg { transition: transform 0.3s ease; }
  .gear-btn:hover { background: oklch(0.93 0.014 85); color: var(--ink-soft); }
  .gear-btn:hover svg { transform: rotate(50deg); }
  .gear-btn:active { transform: scale(0.94); }

  .hchart-card {
    background: oklch(0.99 0.004 85);
    border-radius: var(--radius);
    box-shadow: var(--card-shadow);
    padding: 14px 12px 6px;
  }
  .hchart-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0 4px 10px; }
  .hchart-title { font-size: 15px; font-weight: 700; display: flex; align-items: baseline; gap: 7px; }
  .hchart-title small { font-size: 11.5px; font-weight: 500; color: var(--ink-faint); }
  .metric-switch { display: flex; gap: 6px; }
  .metric-btn {
    border: none; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 600;
    height: 30px; padding: 0 12px; border-radius: 10px;
    background: var(--paper-deep); color: var(--ink-faint);
    box-shadow: 0 1px 2px oklch(0.4 0.02 60 / 0.05);
    transition: background 0.15s, color 0.15s, transform 0.12s;
  }
  .metric-btn.is-active { background: var(--m-soft); color: var(--m-ink); box-shadow: var(--card-shadow); }
  .metric-btn:active { transform: scale(0.95); }
  .hchart-body { position: relative; }
  .hchart-svg { width: 100%; display: block; overflow: visible; }
  .hchart-grid { stroke: oklch(0.94 0.007 85); stroke-width: 1; }
  .hchart-axis { font-size: 9.5px; fill: var(--ink-faint); font-family: inherit; }
  .hchart-band { stroke: var(--ink-faint); stroke-width: 1.3; stroke-dasharray: 5 5; opacity: 0.7; }
  .hchart-band-label { font-size: 9.5px; fill: var(--ink-soft); font-family: inherit; }
  .hchart-line { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .hchart-node { stroke: oklch(0.99 0.005 85); stroke-width: 1.8; transition: r 0.15s; pointer-events: none; }
  .hchart-hit { fill: transparent; cursor: pointer; }
  .hchart-hint { text-align: center; margin: 2px 0 8px; font-size: 12px; color: var(--ink-faint); }
  .chart-tip {
    position: absolute; z-index: 5;
    transform: translate(-50%, calc(-100% - 13px));
    pointer-events: none;
    background: oklch(0.99 0.005 85 / 0.93);
    backdrop-filter: blur(8px);
    border: 1px solid oklch(0.9 0.01 85);
    border-radius: 12px;
    padding: 9px 12px;
    box-shadow: 0 6px 24px oklch(0.3 0.02 60 / 0.14);
    display: flex; flex-direction: column; gap: 3px;
    min-width: 168px;
  }
  .chart-tip-date { font-size: 11.5px; color: var(--ink-faint); white-space: nowrap; }
  .chart-tip-main { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chart-tip-main small { font-size: 11.5px; font-weight: 500; color: var(--ink-faint); }
  .chart-tip-row { display: flex; justify-content: space-between; gap: 14px; font-size: 12px; color: var(--ink-faint); white-space: nowrap; }
  .chart-tip-row b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ---- 测量记录 ---- */
  .rec-section-head { display: flex; align-items: baseline; justify-content: space-between; margin-top: 2px; }
  .rec-section-head h2 { font-size: 16px; font-weight: 700; }
  .rec-count { font-size: 12.5px; color: var(--ink-faint); }
  .rec-list { display: flex; flex-direction: column; gap: 10px; }
  .rec-card { border-radius: var(--radius); box-shadow: var(--card-shadow); background: oklch(0.99 0.004 85); overflow: hidden; }
  .rec-head {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 11px 14px;
    border: none; background: transparent; cursor: pointer;
    font: inherit; color: inherit; text-align: left;
  }
  .density-compact .rec-head { padding: 8px 12px; gap: 10px; }
  .rec-chip {
    flex: none; width: 38px; height: 38px;
    display: grid; place-items: center;
    border-radius: calc(var(--radius) * 0.66);
    font-size: 15px; font-weight: 600;
  }
  .density-compact .rec-chip { width: 33px; height: 33px; font-size: 13.5px; }
  .rec-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .rec-title { font-size: 14.5px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
  .rec-title small { font-size: 13px; font-weight: 500; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .rec-note { font-size: 12px; color: var(--ink-faint); }
  .rec-pill {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    height: 24px; padding: 0 10px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600; white-space: nowrap;
  }
  .rec-pill i { width: 7px; height: 7px; border-radius: 50%; }
  .rec-caret { flex: none; color: var(--ink-faint); transition: transform 0.2s; }
  .rec-card.is-open .rec-caret { transform: rotate(90deg); }
  .rec-detail {
    display: grid; grid-template-columns: auto 1fr; gap: 5px 16px;
    padding: 2px 16px 13px 64px;
    font-size: 12.5px;
    animation: rec-in 0.22s ease;
  }
  .density-compact .rec-detail { padding-left: 55px; }
  .rec-detail dt { color: var(--ink-faint); }
  .rec-detail dd { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  @keyframes rec-in { from { opacity: 0; transform: translateY(-4px); } }

  /* ---- 分页 ---- */
  .pager { display: flex; justify-content: center; align-items: center; gap: 7px; padding-top: 2px; }
  .pager-btn {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border: none; border-radius: 11px; cursor: pointer;
    background: var(--paper-deep); color: var(--ink-soft);
    font: inherit; font-size: 13.5px; font-weight: 600;
    font-variant-numeric: tabular-nums;
    transition: background 0.15s, color 0.15s, transform 0.12s;
  }
  .pager-btn:not(:disabled):hover { background: oklch(0.93 0.014 85); }
  .pager-btn:not(:disabled):active { transform: scale(0.92); }
  .pager-btn.is-active { background: var(--accent-soft); color: var(--accent-ink); }
  .pager-btn:disabled { opacity: 0.35; cursor: default; }

  /* ---- 表单补充:分段选择 / 两列 ---- */
  .seg-row { display: flex; gap: 8px; }
  .seg-btn {
    flex: 1; height: 40px;
    border: 1.5px solid oklch(0.9 0.012 85); border-radius: 12px;
    background: var(--paper); color: var(--ink-soft);
    font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  .seg-btn.is-active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
  .field-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .profile-hint { font-size: 11.5px; color: var(--ink-faint); }

  /* ---- 底部 Tab ---- */
  .tabbar {
    flex: none;
    display: grid; grid-template-columns: repeat(3, 1fr);
    padding: 8px 28px calc(10px + env(safe-area-inset-bottom));
    background: oklch(0.99 0.005 85 / 0.88);
    backdrop-filter: blur(14px);
    border-top: 1px solid oklch(0.92 0.01 85);
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 7px 0 5px;
    min-height: 52px;
    border: none; background: transparent; cursor: pointer;
    font: inherit; font-size: 11.5px; font-weight: 500;
    color: var(--ink-faint);
    border-radius: 14px;
    transition: color 0.15s;
  }
  .tab.is-active { color: var(--accent-ink); }
  .tab.is-active svg { filter: drop-shadow(0 1px 6px oklch(0.72 0.13 var(--accent-hue) / 0.45)); }
</style>
</head>
